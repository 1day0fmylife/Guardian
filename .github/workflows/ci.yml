name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Resolve modules
        run: |
          go mod tidy
          echo '--- GUARDIAN_GO_MOD_BEGIN ---'
          cat go.mod
          echo '--- GUARDIAN_GO_MOD_END ---'
          echo '--- GUARDIAN_GO_SUM_BEGIN ---'
          cat go.sum
          echo '--- GUARDIAN_GO_SUM_END ---'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/guardian

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Build
        run: bun run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
