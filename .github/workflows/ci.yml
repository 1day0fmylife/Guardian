name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian-ci
          POSTGRES_DB: guardian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUARDIAN_TEST_POSTGRES_URL: postgres://guardian:guardian-ci@localhost:5432/guardian_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.13"
          cache: true
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./cmd/guardian

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      - name: Build
        run: bun run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config --quiet
