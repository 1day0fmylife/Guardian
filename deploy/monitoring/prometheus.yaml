# Run Prometheus on the same host/network namespace as the loopback exporter.
# Never expose this unauthenticated exporter through public Caddy ingress.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/guardian.rules.yaml
scrape_configs:
  - job_name: guardian
    scrape_timeout: 5s
    static_configs:
      - targets: ['127.0.0.1:9097']
