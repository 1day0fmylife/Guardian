services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      guardian-server:
        condition: service_healthy
      guardian-web:
        condition: service_started

  guardian-server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    environment:
      GUARDIAN_LISTEN_ADDR: :8080
      GUARDIAN_DATABASE_URL: postgres://guardian:guardian@postgres:5432/guardian?sslmode=disable
      GUARDIAN_REDIS_URL: redis://redis:6379/0
      GUARDIAN_PUBLIC_URL: http://localhost:8088
      GUARDIAN_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/guardian", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  guardian-web:
    build:
      context: ./web
      dockerfile: Dockerfile

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
